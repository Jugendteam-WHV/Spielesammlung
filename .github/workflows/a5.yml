name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile A5
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Jugendteam_Spielesammlung_A5.tex
          working_directory: ./A5
          args: -pdf -file-line-error -interaction=nonstopmode
        continue-on-error: true
      - name: Upload A5 PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: A5/Jugendteam_Spielesammlung_A5.pdf
        continue-on-error: true
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          repository: Jugendteam-WHV/Spielesammlung
          # note you'll typically need to create a personal access token
          # with permissions to create releases in the other repo
          token: ${{ secrets.Actions }}
          files: A5/Jugendteam_Spielesammlung_A5.pdf
