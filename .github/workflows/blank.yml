name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile A4
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Jugendteam_Spielesammlung_A4.tex
          working_directory: ./A4
          args: -pdf -file-line-error -interaction=nonstopmode
      - name: Upload A4 PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: Jugendteam_Spielesammlung_A4.pdf
      - name: Compile A5
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Jugendteam_Spielesammlung_A5.tex
          orking_directory: ./A5
      - name: Upload A5 PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: Jugendteam_Spielesammlung_A5.pdf
