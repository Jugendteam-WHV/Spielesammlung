name: Render Spielesamlung_A4

on: push

jobs:
  render-paper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v5

      - name: Compile Typst
        run: typst compile --font-path fonts Jugendteam_WHV_Spielesamlung_A4.typ Jugendteam_WHV_Spielesamlung_A4.pdf
      - name: Commit PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f Jugendteam_WHV_Spielesamlung_A4.pdf

          git commit -m "Update generated PDF" || echo "No changes"

          git push
