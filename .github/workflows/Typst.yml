name: Render Spielesamlung_A4

on: push

jobs:
  render-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto
          fc-cache -fv

      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v5

      - name: Compile Typst
        run: typst compile Spielesamlung_A4.typ paper.pdf
