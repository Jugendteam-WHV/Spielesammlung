name: Render Spielesamlung_A4

on: push

jobs:
  render-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto
          fc-cache -fv

      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v5

      - name: Compile Typst
        run: typst compile Spielesamlung_A4.typ Spielesamlung_A4.pdf
      - name: Commit PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f Spielesamlung_A4.pdf

          git commit -m "Update generated PDF" || echo "No changes"

          git push
